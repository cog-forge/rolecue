app:
  name: rolecue
  environment: development
  version: 1.0.0
  debug: true

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 5s
  # Reverse proxies (IPs or CIDRs) whose X-Forwarded-For header is believed when working out the client
  # address. Any other peer's header is ignored, so a client cannot forge its logged IP. Behind Caddy or
  # a load balancer, list its address or network here (env SERVER_TRUSTED_PROXIES, comma separated).
  trusted_proxies: [127.0.0.1, "::1"]

database:
  url: ""
  host: localhost
  port: 5434
  user: postgres
  password: postgres
  name: rolecue
  ssl_mode: disable
  # CA certificate path (sslrootcert) for ssl_mode verify-ca / verify-full; env DATABASE_SSL_ROOT_CERT.
  ssl_root_cert: ""
  # When true, production refuses to start unless the connection uses sslmode=verify-full with a root
  # certificate (env DATABASE_REQUIRE_TLS). Off by default so existing deployments keep working.
  require_tls: false
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m
  debug_level: info

auth:
  url: http://localhost:3000
  timeout: 5s
  cookie_prefix: rolecue
  cookie_domain: ""
  secure_cookies: false

cors:
  allow_origins:
    - "http://localhost:3000"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allow_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
    - X-Request-ID
    - Idempotency-Key
  expose_headers:
    - X-Request-ID
    - X-Total-Count
    - X-Export-Truncated
    - Content-Disposition
  allow_credentials: true
  max_age: 86400

logger:
  level: debug
  format: console  # json or console
  output: stdout
  time_format: "2006-01-02T15:04:05.000Z07:00"

tracer:
  enabled: false
  service_name: rolecue-api
  endpoint: localhost:4317
  insecure: true
  sample_rate: 1.0

llm:
  provider: gemini
  api_key: ""
  model: gemini-3.1-flash-lite
  timeout: 30s
  max_retries: 1
  max_output_tokens: 4096  # cap of one completion; 0 = provider default
  user_daily_call_budget: 200  # LLM operations one user may start per UTC day; 0 = unlimited (LLM_USER_DAILY_CALL_BUDGET)

# Request limits (KAN-277): in-memory token buckets, per API instance. per_minute 0 turns a limiter off.
rate_limit:
  enabled: true
  llm_per_minute: 10  # per user, routes that start an LLM call
  llm_burst: 5
  expensive_per_minute: 20  # per user, wallet checkout/sync and uploads
  expensive_burst: 10
  ip_per_minute: 120  # per client address (c.ClientIP) on the same routes
  ip_burst: 40

storage:
  endpoint: ""
  region: ""
  bucket: ""
  access_key_id: ""
  secret_access_key: ""
  session_token: ""

question_bank:
  size: 50  # core questions generated per bank (team decision); 0 disables generation

evaluation:
  weight_total: 100  # a posting's evaluation weights must add up to this; 0 turns the sum check off

# Opt-in task routing. Blank routes preserve LLM_* behavior and service retries.
# Per task: provider, model, timeout (total task budget), max_retries, fallback.
# Environment: AI_<JD_EXTRACTION|QUESTION_BANK|FOLLOW_UP|EVALUATION>_<FIELD>.
# Groq-first model defaults when provider=groq: openai/gpt-oss-120b,
# except follow_up: openai/gpt-oss-20b. Suggested fallback: gemini.
# GROQ_API_KEY is env-only; never put credentials in this file.
# See docs/ai-routing.md for the complete recipe.
ai:
  jd_extraction: {}
  question_bank: {}
  follow_up: {}
  evaluation: {}
