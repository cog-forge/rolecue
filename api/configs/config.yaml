app:
  name: rolecue
  environment: development
  version: 1.0.0
  debug: true

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 5s

database:
  url: ""
  host: localhost
  port: 5434
  user: postgres
  password: postgres
  name: rolecue
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m
  debug_level: info

auth:
  url: http://localhost:3000
  timeout: 5s
  cookie_prefix: rolecue
  cookie_domain: ""
  secure_cookies: false

cors:
  allow_origins:
    - "http://localhost:3000"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allow_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
    - X-Request-ID
  expose_headers:
    - X-Request-ID
  allow_credentials: true
  max_age: 86400

logger:
  level: debug
  format: console  # json or console
  output: stdout
  time_format: "2006-01-02T15:04:05.000Z07:00"

tracer:
  enabled: false
  service_name: rolecue-api
  endpoint: localhost:4317
  insecure: true
  sample_rate: 1.0

llm:
  provider: gemini
  api_key: ""
  model: gemini-3.1-flash-lite
  timeout: 30s
  max_retries: 1

question_bank:
  size: 50  # core questions generated per bank (team decision); 0 disables generation
