basePath: /
definitions:
  apperror.Code:
    enum:
    - JD_IN_USE
    - JD_NOT_FOUND
    - INVALID_CREDENTIALS
    - USER_NOT_FOUND
    - USER_INACTIVE
    - INVALID_TOKEN
    - AUTH_UNAVAILABLE
    - FORBIDDEN
    - ONBOARDING_ROLE_CONFLICT
    - VALIDATION_ERROR
    - INTERNAL_ERROR
    - INVALID_JD_INPUT
    - JD_TOO_SHORT
    - JD_TOO_LONG
    - EXTRACTION_FAILED
    - INVALID_EXTRACTION_OUTPUT
    - JOB_POSTING_NOT_FOUND
    - CORE_QUESTION_NOT_FOUND
    - QUESTION_BANK_EXISTS
    - QUESTION_BANK_LOCKED
    - CORE_QUESTION_IN_USE
    - REQUIREMENTS_NOT_CONFIRMED
    - QUESTION_GENERATION_FAILED
    - INVALID_QUESTION_GENERATION_OUTPUT
    - QUESTION_BANK_UNAVAILABLE
    - WALLET_NOT_FOUND
    - INSUFFICIENT_BALANCE
    - PACKAGE_NOT_FOUND
    - COIN_PACKAGE_NOT_FOUND
    - TRANSACTION_NOT_FOUND
    - PAYMENT_GATEWAY_ERROR
    - PAYOS_ERROR
    - WEBHOOK_SIGNATURE_INVALID
    - JOB_POSTING_NOT_PENDING
    - QUESTION_BANK_NOT_READY
    type: string
    x-enum-varnames:
    - CodeJDInUse
    - CodeJDNotFound
    - CodeInvalidCredentials
    - CodeAccountNotFound
    - CodeAccountLocked
    - CodeInvalidToken
    - CodeAuthUnavailable
    - CodeForbidden
    - CodeOnboardingRoleConflict
    - CodeValidation
    - CodeInternal
    - CodeInvalidJDInput
    - CodeJDTooShort
    - CodeJDTooLong
    - CodeExtractionFailed
    - CodeInvalidExtractionOutput
    - CodeJobPostingNotFound
    - CodeCoreQuestionNotFound
    - CodeQuestionBankExists
    - CodeQuestionBankLocked
    - CodeCoreQuestionInUse
    - CodeRequirementsNotConfirmed
    - CodeQuestionGenerationFailed
    - CodeInvalidQuestionGenerationOutput
    - CodeQuestionBankUnavailable
    - CodeWalletNotFound
    - CodeInsufficientBalance
    - CodePackageNotFound
    - CodeCoinPackageNotFound
    - CodeTransactionNotFound
    - CodePaymentGatewayError
    - CodePayOSError
    - CodeWebhookSignatureInvalid
    - CodeJobPostingNotPending
    - CodeQuestionBankNotReady
  domain.Account:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      image:
        type: string
      is_locked:
        type: boolean
      lock_expires_at:
        type: string
      lock_reason:
        type: string
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  domain.Bank:
    properties:
      editable:
        type: boolean
      generation_size:
        description: GenerationSize is how many questions Generate writes; 0 means
          generation is not configured.
        type: integer
      max_question_length:
        type: integer
      posting_status:
        type: string
      questions:
        items:
          $ref: '#/definitions/domain.CoreQuestion'
        type: array
    type: object
  domain.CoreQuestion:
    properties:
      content:
        type: string
      id:
        type: string
    type: object
  domain.ExtractedSkill:
    properties:
      category:
        $ref: '#/definitions/domain.SkillCategory'
      name:
        type: string
      requirement:
        allOf:
        - $ref: '#/definitions/domain.Requirement'
        description: Empty means the JD does not state whether the skill is required
          or preferred.
    type: object
  domain.List:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/domain.Account'
        type: array
    type: object
  domain.ListItem:
    properties:
      createdAt:
        type: string
      id:
        type: string
      seniorityLevel:
        $ref: '#/definitions/domain.Seniority'
      title:
        type: string
    type: object
  domain.LockRequest:
    properties:
      expires_in:
        type: integer
      reason:
        type: string
    type: object
  domain.NamedRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  domain.Notification:
    properties:
      status:
        type: string
    type: object
  domain.Patch:
    properties:
      company_name:
        type: string
        x-nullable: true
      company_website:
        type: string
        x-nullable: true
      full_name:
        type: string
      image:
        type: string
        x-nullable: true
    type: object
  domain.PostingStatus:
    enum:
    - pending
    - open
    - intake_closed
    - closed
    - rejected
    type: string
    x-enum-varnames:
    - PostingStatusPending
    - PostingStatusOpen
    - PostingStatusIntakeClosed
    - PostingStatusClosed
    - PostingStatusRejected
  domain.PostingSummary:
    properties:
      created_at:
        type: string
      id:
        type: string
      recruiter:
        $ref: '#/definitions/domain.Recruiter'
      status:
        $ref: '#/definitions/domain.PostingStatus'
      title:
        type: string
    type: object
  domain.Profile:
    properties:
      company_name:
        type: string
      company_website:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      id:
        type: string
      image:
        type: string
      onboarding_completed:
        type: boolean
      onboarding_role_selected:
        type: boolean
      role:
        type: string
      updated_at:
        type: string
    type: object
  domain.Recruiter:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  domain.Requirement:
    enum:
    - required
    - preferred
    type: string
    x-enum-varnames:
    - Required
    - Preferred
  domain.ReviewPosting:
    properties:
      content_path:
        description: ContentPath is the URL of the JD content (job_descriptions.content_path),
          the text the Admin reviews.
        type: string
      core_question_count:
        description: CoreQuestionCount tells the Admin whether the posting can be
          approved (it needs at least one).
        type: integer
      created_at:
        type: string
      employment_type:
        type: string
      id:
        type: string
      interview_duration:
        type: integer
      interview_slot:
        type: integer
      location:
        type: string
      recruiter:
        $ref: '#/definitions/domain.Recruiter'
      reject_reason:
        type: string
      required_avatar:
        $ref: '#/definitions/domain.NamedRef'
      required_voice:
        $ref: '#/definitions/domain.NamedRef'
      salary_max:
        type: integer
      salary_min:
        type: integer
      status:
        $ref: '#/definitions/domain.PostingStatus'
      title:
        type: string
    type: object
  domain.Seniority:
    enum:
    - intern
    - junior
    - mid
    - senior
    - lead
    type: string
    x-enum-varnames:
    - Intern
    - Junior
    - Mid
    - Senior
    - Lead
  domain.SkillCategory:
    enum:
    - programming_language
    - framework
    - database
    - tool
    - technology
    - other
    type: string
    x-enum-varnames:
    - ProgrammingLanguage
    - Framework
    - Database
    - Tool
    - Technology
    - Other
  domain.StructuredJD:
    properties:
      domainKnowledge:
        items:
          type: string
        type: array
      seniorityLevel:
        $ref: '#/definitions/domain.Seniority'
      skills:
        items:
          $ref: '#/definitions/domain.ExtractedSkill'
        type: array
      technologies:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  domain.Transition:
    properties:
      changed:
        type: boolean
      notification:
        $ref: '#/definitions/domain.Notification'
      user:
        $ref: '#/definitions/domain.Account'
    type: object
  domain.User:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      id:
        type: string
      image:
        type: string
      is_locked:
        type: boolean
      onboarding_completed:
        type: boolean
      onboarding_role_selected:
        type: boolean
      role:
        type: string
    type: object
  handler.AnalyzeJDRequest:
    properties:
      rawText:
        type: string
    required:
    - rawText
    type: object
  handler.CreateJDRequest:
    properties:
      rawText:
        type: string
      structuredJD:
        $ref: '#/definitions/domain.StructuredJD'
    required:
    - rawText
    - structuredJD
    type: object
  handler.JDResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      rawText:
        type: string
      structuredJD:
        $ref: '#/definitions/domain.StructuredJD'
    type: object
  handler.QuestionBankResponse:
    properties:
      questions:
        items:
          $ref: '#/definitions/domain.CoreQuestion'
        type: array
    type: object
  handler.QuestionRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  handler.RejectPostingRequest:
    properties:
      reject_reason:
        type: string
    required:
    - reject_reason
    type: object
  handler.RoleSelection:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  handler.UpdateJDRequest:
    properties:
      structuredJD:
        $ref: '#/definitions/domain.StructuredJD'
    required:
    - structuredJD
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        $ref: '#/definitions/apperror.Code'
      message:
        type: string
    type: object
  response.Page-domain_ListItem:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.ListItem'
        type: array
      pagination:
        $ref: '#/definitions/response.Pagination'
    type: object
  response.Page-domain_PostingSummary:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.PostingSummary'
        type: array
      pagination:
        $ref: '#/definitions/response.Pagination'
    type: object
  response.Pagination:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: Application API endpoints protected by Better Auth session cookies.
    Health is liveness only.
  title: AI Interview Practice API
  version: 1.0.0
paths:
  /admin/job-postings:
    get:
      consumes:
      - application/json
      description: Admin only. Newest first. Without status, returns the pending queue;
        status=all removes the filter. The date window is [from, to) on created_at.
      parameters:
      - description: pending (default), open, intake_closed, closed, rejected or all
        in: query
        name: status
        type: string
      - description: Recruiter user ID
        format: uuid
        in: query
        name: recruiter_id
        type: string
      - description: Created at or after (RFC 3339)
        format: date-time
        in: query
        name: from
        type: string
      - description: Created before (RFC 3339)
        format: date-time
        in: query
        name: to
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        maximum: 2147483647
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/response.Page-domain_PostingSummary'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: List Job Postings for moderation
      tags:
      - admin-job-postings
  /admin/job-postings/{id}:
    get:
      consumes:
      - application/json
      description: 'Admin only. Read-only: the Admin cannot edit posting content,
        the 3D interviewer or the voice. content_path is the URL of the JD content
        the Admin reviews; core_question_count shows whether the posting can be approved
        (it needs at least one).'
      parameters:
      - description: Job posting ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.ReviewPosting'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get a Job Posting for review
      tags:
      - admin-job-postings
  /admin/job-postings/{id}/approve:
    post:
      consumes:
      - application/json
      description: Admin only. Trusted Origin required. Moves pending to open, which
        makes the posting available. The posting needs at least one core question
        (409 QUESTION_BANK_NOT_READY otherwise), because its question bank is locked
        once it leaves pending. Approving an already open posting returns it unchanged;
        any other non-pending state is 409 JOB_POSTING_NOT_PENDING.
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Job posting ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.ReviewPosting'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Approve a pending Job Posting
      tags:
      - admin-job-postings
  /admin/job-postings/{id}/reject:
    post:
      consumes:
      - application/json
      description: Admin only. Trusted Origin required. Moves pending to rejected
        and stores reject_reason (1-1000 characters) for the Recruiter. Rejecting
        an already rejected posting returns it unchanged and keeps the first reason;
        any other non-pending state is 409. Unknown fields reject the whole request.
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Job posting ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Reject reason; body limit 16 KiB
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RejectPostingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.ReviewPosting'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Reject a pending Job Posting
      tags:
      - admin-job-postings
  /admin/users:
    get:
      parameters:
      - description: Name or email substring
        in: query
        name: search
        type: string
      - description: all, locked, candidate, recruiter, admin
        in: query
        name: filter
        type: string
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.List'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: List system accounts
      tags:
      - admin-users
  /admin/users/{id}:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Account'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get system account details
      tags:
      - admin-users
  /admin/users/{id}/lock:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: User-visible reason and optional expiry in seconds
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.LockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Transition'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Lock a Candidate or Recruiter account
      tags:
      - admin-users
  /admin/users/{id}/unlock:
    post:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Transition'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Unlock a Candidate or Recruiter account
      tags:
      - admin-users
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Current application user
      tags:
      - auth
  /health:
    get:
      description: Does not check database or LLM readiness.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check process liveness
      tags:
      - health
  /jds:
    get:
      consumes:
      - application/json
      parameters:
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        maximum: 2147483647
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/response.Page-domain_ListItem'
              type: object
        "400":
          description: Bad Request
          schema:
