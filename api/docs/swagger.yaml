  domain.ReviewPosting:
    properties:
      content_path:
        description: |-
          ContentPath is job_descriptions.content_path: the storage key of the JD PDF for postings
          created through POST /job-postings, or a full http(s) URL for older rows.
        type: string
      core_question_count:
        description: CoreQuestionCount tells the Admin whether the posting can be
          approved (it needs at least one).
        type: integer
      created_at:
        type: string
      document_expires_at:
        type: string
