info:
  contact: {}
  description: Application API endpoints protected by Better Auth session cookies.
    Health is liveness only.
  title: AI Interview Practice API
  version: 1.0.0
paths:
  /admin/billing/export:
    get:
      description: Admin only. Read-only CSV export respecting active filters, including
        the [date_from, date_to) window on created_at (up to 5,000 rows), with CSV
        formula-injection protection. Created At is RFC 3339 in Vietnam time (+07:00).
        Sets X-Total-Count and X-Export-Truncated headers.
      parameters:
      - description: Search by transaction ID, user name/email/ID, order code, or
          description
        in: query
        name: search
        type: string
      - description: Filter by status (pending, success, failed, cancelled)
        in: query
        name: status
        type: string
      - description: Filter by transaction type (topup, spend, refund)
        in: query
        name: type
        type: string
      - description: Filter by package or feature name
        in: query
        name: package
        type: string
      - description: Minimum amount filter
        in: query
        name: amount_min
        type: integer
      - description: Maximum amount filter
        in: query
        name: amount_max
        type: integer
      - description: Created at or after (RFC 3339 with offset, e.g. 2026-10-01T00:00:00+07:00)
        format: date-time
        in: query
        name: date_from
        type: string
      - description: Created before (RFC 3339 with offset, exclusive)
        format: date-time
        in: query
        name: date_to
        type: string
      - default: created_at
        description: Sort field (created_at, id, amount, coins, status)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: sort_order
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV file
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Export filtered admin transactions as CSV
      tags:
      - admin-billing
  /admin/billing/revenue-report:
    get:
      description: Admin only. Read-only. Revenue is the VND of successful PayOS top-ups
        in [date_from, date_to); coin movements are not revenue. Compares the window
        with the same dates one year earlier (default) or with the period of the same
        length just before it. The series is by day for windows up to 62 days and
        by month otherwise, in Vietnam time (UTC+07:00). Outstanding coins are what
        users hold now, valued at the all-time average price per coin.
      parameters:
      - description: Window start, inclusive (RFC 3339 with offset, e.g. 2026-10-01T00:00:00+07:00)
        format: date-time
        in: query
        name: date_from
        required: true
        type: string
      - description: Window end, exclusive (RFC 3339 with offset)
        format: date-time
        in: query
        name: date_to
        required: true
        type: string
      - description: previous_year (default) or previous_period
        in: query
        name: compare
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.RevenueReport'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get the admin revenue report with a period comparison
      tags:
      - admin-billing
  /admin/billing/summary:
    get:
      description: Admin only. Read-only. Computes revenue strictly from status='success'
        transactions with payos_order_code (KAN-192). Accepts the same filters as
        the transaction list so both pages always agree. The report time window is
        [date_from, date_to) on created_at; without it the figures cover all time.
      parameters:
      - description: Search by transaction ID, user name/email/ID, order code, or
          description
        in: query
        name: search
        type: string
      - description: Filter by status (pending, success, failed, cancelled)
        in: query
        name: status
        type: string
      - description: Filter by transaction type (topup, spend, refund)
        in: query
        name: type
        type: string
      - description: Filter by package or feature name
        in: query
        name: package
        type: string
      - description: Minimum amount filter
        in: query
        name: amount_min
        type: integer
      - description: Maximum amount filter
        in: query
        name: amount_max
        type: integer
      - description: Created at or after (RFC 3339 with offset, e.g. 2026-10-01T00:00:00+07:00)
        format: date-time
        in: query
        name: date_from
        type: string
      - description: Created before (RFC 3339 with offset, exclusive)
        format: date-time
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.BillingSummary'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get shared admin billing & revenue summary
      tags:
      - admin-billing
  /admin/billing/transactions:
    get:
      description: Admin only. Read-only paginated list of transactions enriched with
        user and package details, newest first by default. The date window is [date_from,
        date_to) on created_at.
      parameters:
      - default: 1
        description: Page number
        in: query
        maximum: 10000
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: Search by transaction ID, user name/email/ID, order code, or
          description
        in: query
        name: search
        type: string
      - description: Filter by status (pending, success, failed, cancelled)
        in: query
        name: status
        type: string
      - description: Filter by transaction type (topup, spend, refund)
        in: query
        name: type
        type: string
      - description: Filter by package or feature name
        in: query
        name: package
        type: string
      - description: Minimum amount filter
        in: query
        name: amount_min
        type: integer
      - description: Maximum amount filter
        in: query
        name: amount_max
        type: integer
      - description: Created at or after (RFC 3339 with offset, e.g. 2026-10-01T00:00:00+07:00)
        format: date-time
        in: query
        name: date_from
        type: string
      - description: Created before (RFC 3339 with offset, exclusive)
        format: date-time
        in: query
        name: date_to
        type: string
      - default: created_at
        description: Sort field (created_at, id, amount, coins, status)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.AdminTransactionPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: List admin payment and coin ledger transactions
      tags:
      - admin-billing
  /admin/billing/transactions/{id}:
    get:
      description: Admin only. Read-only transaction detail by UUID.
      parameters:
      - description: Transaction UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.AdminTransactionItem'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get a single transaction's detail for Admin inspection
      tags:
      - admin-billing
  /admin/interviews:
    get:
      description: 'Admin only. Operational metadata only: no recording path, audio,
        video, transcript or answer text. Sorted by interview ID. Page size is capped
        at 100.'
      parameters:
      - description: practice or recruitment
        in: query
        name: type
        type: string
      - description: Candidate (owner) ID
        in: query
        name: candidate_id
        type: string
      - description: Job Posting ID
        in: query
        name: job_posting_id
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
