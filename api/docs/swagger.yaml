basePath: /
definitions:
  apperror.Code:
    enum:
    - JD_IN_USE
    - JD_NOT_FOUND
    - INVALID_CREDENTIALS
    - USER_NOT_FOUND
    - USER_INACTIVE
    - INVALID_TOKEN
    - AUTH_UNAVAILABLE
    - FORBIDDEN
    - VALIDATION_ERROR
    - INTERNAL_ERROR
    - INVALID_JD_INPUT
    - JD_TOO_SHORT
    - JD_TOO_LONG
    - EXTRACTION_FAILED
    - INVALID_EXTRACTION_OUTPUT
    - JOB_POSTING_NOT_FOUND
    - CORE_QUESTION_NOT_FOUND
    - QUESTION_BANK_EXISTS
    - QUESTION_BANK_LOCKED
    - CORE_QUESTION_IN_USE
    - REQUIREMENTS_NOT_CONFIRMED
    - QUESTION_GENERATION_FAILED
    - INVALID_QUESTION_GENERATION_OUTPUT
    - QUESTION_BANK_UNAVAILABLE
    type: string
    x-enum-varnames:
    - CodeJDInUse
    - CodeJDNotFound
    - CodeInvalidCredentials
    - CodeAccountNotFound
    - CodeAccountLocked
    - CodeInvalidToken
    - CodeAuthUnavailable
    - CodeForbidden
    - CodeValidation
    - CodeInternal
    - CodeInvalidJDInput
    - CodeJDTooShort
    - CodeJDTooLong
    - CodeExtractionFailed
    - CodeInvalidExtractionOutput
    - CodeJobPostingNotFound
    - CodeCoreQuestionNotFound
    - CodeQuestionBankExists
    - CodeQuestionBankLocked
    - CodeCoreQuestionInUse
    - CodeRequirementsNotConfirmed
    - CodeQuestionGenerationFailed
    - CodeInvalidQuestionGenerationOutput
    - CodeQuestionBankUnavailable
  domain.CoreQuestion:
    properties:
      content:
        type: string
      id:
        type: string
    type: object
  domain.ExtractedSkill:
    properties:
      category:
        $ref: '#/definitions/domain.SkillCategory'
      name:
        type: string
      requirement:
        allOf:
        - $ref: '#/definitions/domain.Requirement'
        description: Empty means the JD does not state whether the skill is required
          or preferred.
    type: object
  domain.ListItem:
    properties:
      createdAt:
        type: string
      id:
        type: string
      seniorityLevel:
        $ref: '#/definitions/domain.Seniority'
      status:
        $ref: '#/definitions/domain.Status'
      title:
        type: string
      updatedAt:
        type: string
    type: object
  domain.Patch:
    properties:
      company_name:
        type: string
        x-nullable: true
      company_website:
        type: string
        x-nullable: true
      full_name:
        type: string
      image:
        type: string
        x-nullable: true
    type: object
  domain.Profile:
    properties:
      company_name:
        type: string
      company_website:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      id:
        type: string
      image:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  domain.Requirement:
    enum:
    - required
    - preferred
    type: string
    x-enum-varnames:
    - Required
    - Preferred
  domain.Seniority:
    enum:
    - intern
    - junior
    - mid
    - senior
    - lead
    type: string
    x-enum-varnames:
    - Intern
    - Junior
    - Mid
    - Senior
    - Lead
  domain.SkillCategory:
    enum:
    - programming_language
    - framework
    - database
    - tool
    - technology
    - other
    type: string
    x-enum-varnames:
    - ProgrammingLanguage
    - Framework
    - Database
    - Tool
    - Technology
    - Other
  domain.Status:
    enum:
    - uploaded
    - parsing
    - parsed
    - customized
    - locked
    - failed
    type: string
    x-enum-varnames:
    - StatusUploaded
    - StatusParsing
    - StatusParsed
    - StatusCustomized
    - StatusLocked
    - StatusFailed
  domain.StructuredJD:
    properties:
      domainKnowledge:
        items:
          type: string
        type: array
      seniorityLevel:
        $ref: '#/definitions/domain.Seniority'
      skills:
        items:
          $ref: '#/definitions/domain.ExtractedSkill'
        type: array
      technologies:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  domain.User:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      id:
        type: string
      image:
        type: string
      is_locked:
        type: boolean
      role:
        type: string
    type: object
  handler.AnalyzeJDRequest:
    properties:
      rawText:
        type: string
    required:
    - rawText
    type: object
  handler.CreateJDRequest:
    properties:
      rawText:
        type: string
      structuredJD:
        $ref: '#/definitions/domain.StructuredJD'
    required:
    - rawText
    - structuredJD
    type: object
  handler.JDResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      rawText:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      structuredJD:
        $ref: '#/definitions/domain.StructuredJD'
      updatedAt:
        type: string
    type: object
  handler.QuestionBankResponse:
    properties:
      questions:
        items:
          $ref: '#/definitions/domain.CoreQuestion'
        type: array
    type: object
  handler.QuestionRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  handler.UpdateJDRequest:
    properties:
      structuredJD:
        $ref: '#/definitions/domain.StructuredJD'
    required:
    - structuredJD
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        $ref: '#/definitions/apperror.Code'
      message:
        type: string
    type: object
  response.Page-domain_ListItem:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.ListItem'
        type: array
      pagination:
        $ref: '#/definitions/response.Pagination'
    type: object
  response.Pagination:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: Application API endpoints protected by Better Auth session cookies.
    Health is liveness only.
  title: AI Interview Practice API
  version: 1.0.0
paths:
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Current application user
      tags:
      - auth
  /health:
    get:
      description: Does not check database or LLM readiness.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check process liveness
      tags:
      - health
  /jds:
    get:
      consumes:
      - application/json
      parameters:
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        maximum: 2147483647
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/response.Page-domain_ListItem'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: List current user's JDs
      tags:
      - jds
    post:
      consumes:
      - application/json
      parameters:
      - description: JD request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateJDRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.JDResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Save a reviewed JD
      tags:
      - jds
  /jds/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: JD UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Delete an owned JD
      tags:
      - jds
    get:
      consumes:
      - application/json
      parameters:
      - description: JD UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.JDResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get an owned JD
      tags:
      - jds
    put:
      consumes:
      - application/json
      parameters:
      - description: JD request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateJDRequest'
      - description: JD UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.JDResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Update reviewed fields; original raw text is immutable
      tags:
      - jds
  /jds/analyze:
    post:
      consumes:
      - application/json
      parameters:
      - description: JD request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AnalyzeJDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.StructuredJD'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Analyze a raw JD without saving
      tags:
      - jds
  /job-postings/{id}/questions:
    get:
      description: Recruiter only. Candidates never receive the bank.
      parameters:
      - description: Job posting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.QuestionBankResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: List the core-question bank of your own job posting
      tags:
      - job-posting-questions
    post:
      consumes:
      - application/json
      description: Recruiter only, while the posting is pending. Trusted Origin required.
        Unknown fields reject the whole request.
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Job posting ID
        in: path
        name: id
        required: true
        type: string
      - description: Question; body limit 16 KiB
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.QuestionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.CoreQuestion'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Add a question to the bank of your own job posting
      tags:
      - job-posting-questions
  /job-postings/{id}/questions/{questionId}:
    delete:
      description: Recruiter only, while the posting is pending. A question already
        used by an interview cannot be deleted. Trusted Origin required.
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Job posting ID
        in: path
        name: id
        required: true
        type: string
      - description: Question ID
        in: path
        name: questionId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Delete a question from the bank of your own job posting
      tags:
      - job-posting-questions
    patch:
      consumes:
      - application/json
      description: Recruiter only, while the posting is pending. Trusted Origin required.
        Unknown fields reject the whole request.
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Job posting ID
        in: path
        name: id
        required: true
        type: string
      - description: Question ID
        in: path
        name: questionId
        required: true
        type: string
      - description: Question; body limit 16 KiB
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.QuestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.CoreQuestion'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Edit a question in the bank of your own job posting
      tags:
      - job-posting-questions
  /job-postings/{id}/questions/generate:
    post:
      description: 'Recruiter only. Runs only while the bank is empty: a posting that
        already has questions returns 409 (a bank emptied by deleting every question
        can be generated again). Only while the posting is pending. Requires confirmed
        requirements. Trusted Origin required.'
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Job posting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.QuestionBankResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Generate the core-question bank of your own job posting
      tags:
      - job-posting-questions
  /profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Profile'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get your own profile
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: Omitted keys are unchanged. Null removes image/company values;
        full_name cannot be null. Only recruiters may change company fields. Trusted
        Origin required. Unknown fields reject the whole request.
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Changed profile fields (at least one); body limit 16 KiB
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Patch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Profile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Update allowed fields in your own profile
      tags:
      - profile
securityDefinitions:
  SessionCookie:
    description: Better Auth HttpOnly session cookie. Production uses __Secure-rolecue.session_token;
      browser sends cookies automatically.
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
