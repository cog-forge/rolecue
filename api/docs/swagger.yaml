        type: boolean
      interview_slot:
        description: InterviewSlot is nil until the Recruiter funds capacity.
        type: integer
      posting_status:
        type: string
      price_per_slot:
        type: integer
      refundable:
        description: Refundable is the slots not consumed by an interview, in slots.
        type: integer
      refunded:
        description: |-
          Refunded is the coins credited back at terminal close. It is non-null only when the posting is
          closed, and then equals Refundable times PricePerSlot at close.
        type: integer
    type: object
