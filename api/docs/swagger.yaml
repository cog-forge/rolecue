          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: List the Candidate's interview sessions
      tags:
      - interviews
    post:
      consumes:
      - application/json
      description: 'Candidate only. Creates a session, or returns the existing recruitment
        session of the Application (200, no side effects). A practice session needs
        a confirmed role profile of yours and charges 5 coins once; starting again
        while that role profile still has an unfinished practice session returns it
        (200) without charging. Its avatar must be in your own inventory and its voice
        active. A recruitment session needs no role profile and takes its interviewer
        and voice from the posting (sending avatar_id or voice_id is a VALIDATION_ERROR);
        it needs an interview_eligible Application inside its 24-hour deadline, a
        funded posting with a free interview slot, and a question bank; it is free.
        Errors: VALIDATION_ERROR (bad type, missing or unknown reference), FORBIDDEN
        (not a Candidate), JOB_POSTING_NOT_FOUND, APPLICATION_NOT_FOUND (not yours
        or missing), APPLICATION_NOT_ELIGIBLE, INTERVIEW_CAPACITY_NOT_FUNDED, INTERVIEW_CAPACITY_FULL,
        ROLE_PROFILE_REQUIRED (practice only), JD_NOT_FOUND (role profile missing
        or not yours), QUESTION_BANK_NOT_READY, INSUFFICIENT_BALANCE.'
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Optional. A practice start repeated with the same key returns
          the first session and charges once; up to 128 characters
        in: header
        name: Idempotency-Key
        type: string
