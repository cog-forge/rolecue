      description: 'Recruiter only, own postings. Approve or reject an Application
        whose status is interviewed. The decision is open only once the review window
        has opened: now is at or after the latest interview deadline of the Job Posting
        (final_review.opens_at in Application Detail); before that the answer is FINAL_REVIEW_LOCKED.
