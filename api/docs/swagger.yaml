    properties:
      available_to_approve:
        description: AvailableToApprove is the number of slots no CV approval has
          taken yet.
        type: integer
      consumed:
        description: Consumed counts interviews that used a slot.
        type: integer
      cv_approvals:
        description: CVApprovals counts every Application ever CV-approved on the
          posting.
        type: integer
