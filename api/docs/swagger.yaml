  /admin/interviews/{id}:
    get:
      description: Admin only. Read-only. Returns identifiers, names, score and counts.
        Never returns a recording path, audio, video, transcript, answer or feedback
        text.
      parameters:
      - description: Interview ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.InterviewDetail'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get an interview session's operational detail
      tags:
      - admin-interviews
  /admin/job-postings:
    get:
      consumes:
      - application/json
      description: Admin only. Newest first. Without status, returns the pending queue;
        status=all removes the filter. The date window is [from, to) on created_at.
      parameters:
      - description: pending (default), open, intake_closed, closed, rejected or all
        in: query
        name: status
        type: string
      - description: Recruiter user ID
        format: uuid
        in: query
        name: recruiter_id
        type: string
      - description: Created at or after (RFC 3339)
        format: date-time
        in: query
        name: from
        type: string
      - description: Created before (RFC 3339)
        format: date-time
        in: query
        name: to
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        maximum: 2147483647
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/response.Page-domain_PostingSummary'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: List Job Postings for moderation
      tags:
      - admin-job-postings
  /admin/job-postings/{id}:
    get:
      consumes:
      - application/json
      description: 'Admin only. Read-only: the Admin cannot edit posting content,
        the 3D interviewer or the voice. content_path is the URL of the JD content
        the Admin reviews; core_question_count shows whether the posting can be approved
        (it needs at least one).'
      parameters:
      - description: Job posting ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.ReviewPosting'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get a Job Posting for review
      tags:
      - admin-job-postings
  /admin/job-postings/{id}/approve:
    post:
      consumes:
      - application/json
      description: Admin only. Trusted Origin required. Moves pending to open. The
        posting reaches Candidates on the job board only once its Recruiter funds
        interview slots. The posting needs at least one core question (409 QUESTION_BANK_NOT_READY
        otherwise), because its question bank is locked once it leaves pending. Approving
        an already open posting returns it unchanged; any other non-pending state
        is 409 JOB_POSTING_NOT_PENDING.
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Job posting ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.ReviewPosting'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Approve a pending Job Posting
      tags:
      - admin-job-postings
  /admin/job-postings/{id}/reject:
    post:
      consumes:
      - application/json
      description: Admin only. Trusted Origin required. Moves pending to rejected
        and stores reject_reason (1-1000 characters) for the Recruiter. Rejecting
        an already rejected posting returns it unchanged and keeps the first reason;
        any other non-pending state is 409. Unknown fields reject the whole request.
      parameters:
      - description: Trusted frontend origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Job posting ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Reject reason; body limit 16 KiB
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RejectPostingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.ReviewPosting'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Reject a pending Job Posting
      tags:
      - admin-job-postings
  /admin/overview:
    get:
      description: |-
        Admin only. Read-only aggregates over a window of 7, 30 or 90 days (default 30). The window is [now-days, now). Accounts count Candidate and Recruiter users only (Admin excluded). locked means is_locked and the lock has not expired. new_in_window counts users created in the window. job_postings and applications by status are all-time counts; submitted_in_window counts applications created in the window. Interview *_started_in_window use started_at by type, completed_in_window uses completed_at, evaluation_failed is all-time. finance is the wallet billing summary over the window: revenue is successful PayOS top-ups only, and coin debits and refunds are not revenue. The response carries no personal data.
        The blocks are read in separate statements, not one snapshot, so figures that relate to each other (for example applications by status and applications submitted in the window) can differ slightly while data is being written.
      parameters:
      - default: 30
        description: Window in days
        enum:
        - 7
        - 30
        - 90
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Overview'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - SessionCookie: []
      summary: Get the Admin platform and finance overview
      tags:
      - admin-overview
