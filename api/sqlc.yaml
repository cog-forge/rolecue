version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/features/jd/repository/query/"
    schema: "migration/"
    gen:
      go:
        package: "repository"
        out: "internal/features/jd/repository"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
