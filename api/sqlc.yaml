# Auth/profile use the current migration schema.
# Legacy JD queries remain in sqlc.jd.yaml pending their schema update.
version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/features/auth/repository/query/"
    schema: "migrations/"
    gen:
      go:
        package: "repository"
        out: "internal/features/auth/repository"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
  - engine: "postgresql"
    queries: "internal/features/profile/repository/query/"
    schema: "migrations/"
    gen:
      go:
        package: "repository"
        out: "internal/features/profile/repository"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
  - engine: "postgresql"
    queries: "internal/features/wallet/repository/query/"
    schema: "migrations/"
    gen:
      go:
        package: "repository"
        out: "internal/features/wallet/repository"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
