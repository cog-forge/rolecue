# Used by make run/dev with the unchanged root Compose definition.
# The project flag isolates the volume; this name also isolates the container.
services:
  postgres:
    container_name: rolecue-authentication-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
