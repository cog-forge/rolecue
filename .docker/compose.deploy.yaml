name: rolecue

# Baseline container hardening shared by every service (KAN-301). Services add
# back only the capabilities they need. mem_limit and pids_limit are generous
# ceilings against runaway processes, not tuned reservations; raise them per
# host if a workload legitimately needs more.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    container_name: rolecue-postgres
    restart: unless-stopped
    <<: *hardening
    # The entrypoint starts as root, fixes ownership of PGDATA and drops to the
    # postgres user with gosu, so those capabilities are required.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    pids_limit: 512
    mem_limit: 2g
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [private]

  migrate:
    image: migrate/migrate:v4.19.0@sha256:d5c978181e3bfa55cc50e3bd8d7da3d87418a87693453250a8804b81ee6494db
    container_name: rolecue-migrate
    # The URL is handed over as an environment variable and expanded by the
    # container's own shell, so it no longer appears in the compose command
    # (`docker compose config`, `docker inspect` Config.Cmd, `docker ps` output).
    # golang-migrate has no env/file option for -database, so the migrate process
    # argv inside the container still carries it; see docs/security-notes.md.
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec migrate -path /migrations -database "$$DATABASE_URL" up']
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    restart: "no"
    <<: *hardening
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../api/migrations:/migrations:ro
    networks: [private]

  auth:
    image: ${REGISTRY:-ghcr.io/cog-forge}/rolecue-auth:${IMAGE_TAG:?Set IMAGE_TAG}${AUTH_IMAGE_DIGEST:+@}${AUTH_IMAGE_DIGEST:-}
    container_name: rolecue-auth
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_URL: ${APP_URL:?Set APP_URL}
      AUTH_BASE_URL: ${AUTH_BASE_URL:?Set AUTH_BASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL:?Set DATABASE_URL}}
      BETTER_AUTH_COOKIE_PREFIX: ${BETTER_AUTH_COOKIE_PREFIX:-rolecue}
      BETTER_AUTH_COOKIE_DOMAIN: ${BETTER_AUTH_COOKIE_DOMAIN:?Set BETTER_AUTH_COOKIE_DOMAIN}
      ADMIN_AUTH_INTERNAL_SECRET: ${ADMIN_AUTH_INTERNAL_SECRET:?Set ADMIN_AUTH_INTERNAL_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?Set RESEND_FROM_EMAIL}
      RESEND_VERIFY_EMAIL_TEMPLATE_ID: ${RESEND_VERIFY_EMAIL_TEMPLATE_ID:?Set RESEND_VERIFY_EMAIL_TEMPLATE_ID}
      RESEND_RESET_PASSWORD_TEMPLATE_ID: ${RESEND_RESET_PASSWORD_TEMPLATE_ID:?Set RESEND_RESET_PASSWORD_TEMPLATE_ID}
      RESEND_ACCOUNT_LOCKED_TEMPLATE_ID: ${RESEND_ACCOUNT_LOCKED_TEMPLATE_ID:-}
      RESEND_ACCOUNT_UNLOCKED_TEMPLATE_ID: ${RESEND_ACCOUNT_UNLOCKED_TEMPLATE_ID:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["3001"]
    networks: [private]

  api:
    image: ${REGISTRY:-ghcr.io/cog-forge}/rolecue-api:${IMAGE_TAG:?Set IMAGE_TAG}${API_IMAGE_DIGEST:+@}${API_IMAGE_DIGEST:-}
    container_name: rolecue-api
    restart: unless-stopped
    <<: *hardening
    # No read_only here: Blender writes its config and cache under
    # /home/rolecue (which also holds the baked-in VRM extension) and a
    # tmpfs there would hide the extension. /tmp stays writable by default.
    pids_limit: 512
    mem_limit: 3g
    environment:
      APP_ENVIRONMENT: production
      APP_VERSION: ${IMAGE_TAG}
      APP_DEBUG: "false"
      # Caddy reaches the API over the Docker bridge, so its forwarded client IP is trusted from there.
      SERVER_TRUSTED_PROXIES: ${SERVER_TRUSTED_PROXIES:-172.16.0.0/12}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      LOGGER_FORMAT: ${LOGGER_FORMAT:-json}
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL:?Set DATABASE_URL}}
      AUTH_UPSTREAM_URL: http://auth:3001
      AUTH_BASE_URL: ${AUTH_BASE_URL:?Set AUTH_BASE_URL}
      AUTH_SECURE_COOKIES: "true"
      BETTER_AUTH_COOKIE_PREFIX: ${BETTER_AUTH_COOKIE_PREFIX:-rolecue}
      BETTER_AUTH_COOKIE_DOMAIN: ${BETTER_AUTH_COOKIE_DOMAIN:?Set BETTER_AUTH_COOKIE_DOMAIN}
      ADMIN_AUTH_INTERNAL_SECRET: ${ADMIN_AUTH_INTERNAL_SECRET:?Set ADMIN_AUTH_INTERNAL_SECRET}
      CORS_ALLOW_ORIGINS: ${APP_URL:?Set APP_URL}
      CORS_ALLOW_CREDENTIALS: "true"
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:?Set PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY:?Set PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:?Set PAYOS_CHECKSUM_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      STORAGE_SSE: ${STORAGE_SSE:-}
      STORAGE_SSE_KMS_KEY_ID: ${STORAGE_SSE_KMS_KEY_ID:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-koreacentral}
      TTS_TIMEOUT: ${TTS_TIMEOUT:-10s}
      TTS_SYNC_LOCALES: ${TTS_SYNC_LOCALES:-en}
      QUESTION_BANK_SIZE: ${QUESTION_BANK_SIZE:-50}
      EVALUATION_WEIGHT_TOTAL: ${EVALUATION_WEIGHT_TOTAL:-100}
      AVATAR_CONVERSION_ENABLED: ${AVATAR_CONVERSION_ENABLED:-false}
      AVATAR_BLENDER_BINARY: ${AVATAR_BLENDER_BINARY:-blender}
      AVATAR_CONVERSION_TIMEOUT: ${AVATAR_CONVERSION_TIMEOUT:-120s}
      AVATAR_MAX_INPUT_BYTES: ${AVATAR_MAX_INPUT_BYTES:-52428800}
      AVATAR_MAX_OUTPUT_BYTES: ${AVATAR_MAX_OUTPUT_BYTES:-104857600}
      AVATAR_VRM_COMMERCIAL_USAGE: ${AVATAR_VRM_COMMERCIAL_USAGE:-}
      AVATAR_VRM_LICENSE_URL: ${AVATAR_VRM_LICENSE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    expose: ["8080"]
    networks: [private]

  frontend:
    image: ${REGISTRY:-ghcr.io/cog-forge}/rolecue-frontend:${IMAGE_TAG:?Set IMAGE_TAG}${FRONTEND_IMAGE_DIGEST:+@}${FRONTEND_IMAGE_DIGEST:-}
    container_name: rolecue-frontend
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
      # Next.js image-optimisation cache; the image owns it as uid 65532.
      - /app/.next/cache:uid=65532,gid=65532
    pids_limit: 256
    mem_limit: 768m
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    expose: ["3000"]
    networks: [private]

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: rolecue-caddy
    restart: unless-stopped
    <<: *hardening
    # Only needed to bind ports 80 and 443 inside the container.
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 256m
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      # Origin (scheme + host, no path) of NEXT_PUBLIC_AVATURN_PROJECT_URL; it is allowed to use the camera.
      AVATURN_ORIGIN: ${AVATURN_ORIGIN:-https://rolecue.avaturn.dev}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../.caddy/Caddyfile.deploy:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      auth:
        condition: service_healthy
      api:
        condition: service_started
      frontend:
        condition: service_healthy
    networks: [private]

networks:
  # Deliberately not `internal: true`. An internal network has no gateway, so
  # auth and api could not reach Resend, PayOS, the LLM provider, S3, Azure
  # Speech or the OAuth providers, and caddy could not obtain certificates.
  # Postgres, migrate, frontend and the service ports are only reachable from
  # this network (nothing but caddy publishes host ports). Egress filtering, if
  # wanted, belongs at the host firewall.
  private:
    name: rolecue-private

volumes:
  postgres-data:
    name: rolecue-postgres-data
  caddy-data:
    name: rolecue-caddy-data
  caddy-config:
    name: rolecue-caddy-config
