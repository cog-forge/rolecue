name: rolecue

services:
  postgres:
    image: postgres:18.6
    container_name: rolecue-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql

  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/_dev/health]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
