name: rolecue

services:
  postgres:
    image: postgres:18.6
    container_name: rolecue-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
