name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24.20.0
  NEXT_TELEMETRY_DISABLED: '1'

# Pre-commit hooks run locally only; CI runs the equivalent format/lint checks per component.
jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_DB: rolecue_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d rolecue_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://ci:ci-only@localhost:5432/rolecue_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      # `check` would run the unit tests a second time without -race.
      - run: make -C api tools fmt-check vet lint build test-race vuln
      - name: Migrate disposable database
        run: api/.tools/migrate-v4.19.0/migrate -path api/migrations -database "$DATABASE_URL" up
      - run: make -C api test-integration

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --cwd frontend --frozen-lockfile --ignore-scripts
      - run: make frontend-check
      - name: Dependency vulnerability audit
        run: make frontend-audit

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Ships Chromium and its system libraries, replacing a slow `playwright install --with-deps`.
    # Keep the tag equal to @playwright/test in frontend/package.json; the image provides Node 24.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      # Without it the avatar creator stays disabled and its specs cannot open Avaturn.
      NEXT_PUBLIC_AVATURN_PROJECT_URL: ${{ secrets.NEXT_PUBLIC_AVATURN_PROJECT_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-bun needs unzip, which the image lacks; the npm package needs no extra tools.
      - name: Install Bun
        run: |
          npm install --global --prefix "$HOME/.local" --no-fund --no-audit "bun@$BUN_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  auth:
    name: Auth
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Dependency vulnerability audit
        run: bun audit --audit-level=high

  # Runs alongside the gates rather than after them; `publish` still waits on every gate via `checks`.
  images:
    name: Image (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIVY_CACHE_DIR: .cache/trivy
    strategy:
      fail-fast: false
      matrix:
        component: [api, frontend, auth]
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_DB: rolecue_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d rolecue_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Select public API URL
        env:
          CONFIGURED_API_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo 'API_URL=http://localhost:8080' >> "$GITHUB_ENV"
          else
            test -n "$CONFIGURED_API_URL" || { echo 'Missing NEXT_PUBLIC_API_BASE_URL secret'; exit 1; }
            printf 'API_URL=%s\n' "$CONFIGURED_API_URL" >> "$GITHUB_ENV"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          load: true
          tags: rolecue-${{ matrix.component }}:ci
          labels: |
            org.opencontainers.image.source=https://github.com/cog-forge/rolecue
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.API_URL }}
            NEXT_PUBLIC_AVATURN_PROJECT_URL=${{ secrets.NEXT_PUBLIC_AVATURN_PROJECT_URL }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Smoke test
        env:
          DATABASE_URL: postgres://ci:ci-only@localhost:5432/rolecue_ci?sslmode=disable
        run: sh .docker/smoke.sh '${{ matrix.component }}' 'rolecue-${{ matrix.component }}:ci'
      - name: Scan final runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: rolecue-${{ matrix.component }}:ci
          scanners: vuln
          format: json
          output: trivy-${{ matrix.component }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      # Misconfiguration and secret scanning use the same HIGH/CRITICAL policy
      # as `make image-scan` and fail the job. To prove the gate, add `USER root`
      # as the last line of a Dockerfile in a throwaway branch: the first step
      # reports DS-0002 (HIGH) and CI fails.
      - name: Scan Dockerfile and build context (misconfig, secret)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: ${{ matrix.component }}
          scanners: misconfig,secret
          skip-dirs: node_modules,.next,.tools
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan image layers and config (secret, misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: rolecue-${{ matrix.component }}:ci
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate SBOM
        run: trivy image --format cyclonedx --exit-code 0 --output sbom-${{ matrix.component }}.json rolecue-${{ matrix.component }}:ci
      - name: Enforce vulnerability policy
        run: make image-scan IMAGE=rolecue-${{ matrix.component }}:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-${{ matrix.component }}
          path: |
            trivy-${{ matrix.component }}.json
            sbom-${{ matrix.component }}.json
          retention-days: 14
      - name: Save validated image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save rolecue-${{ matrix.component }}:ci -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: image-${{ matrix.component }}
          path: image.tar
          retention-days: 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests scan only their own commits; pushes to main scan the full history.
      - name: Scan for committed secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          opts=()
          if [ -n "$BASE_SHA" ]; then opts+=("--log-opts=$BASE_SHA..$HEAD_SHA"); fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 "${opts[@]}"

  checks:
    name: CI checks
    if: always()
    needs: [api, frontend, e2e, auth, images, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values()), 'A required CI gate failed or was skipped'
          PY

  publish:
    name: Publish GHCR
    needs: checks
    if: >-
      github.repository == 'cog-forge/rolecue' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing; granted to this job only
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      api_digest: ${{ steps.push.outputs.api_digest }}
      auth_digest: ${{ steps.push.outputs.auth_digest }}
      frontend_digest: ${{ steps.push.outputs.frontend_digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-*
          path: scans
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Push exactly the scanned images
        id: push
        run: |
          tag='${{ steps.tag.outputs.value }}'
          for component in api frontend auth; do
            docker load -i "images/image-$component/image.tar"
            image="ghcr.io/cog-forge/rolecue-$component"
            docker tag "rolecue-$component:ci" "$image:$tag"
            docker push "$image:$tag"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")
            printf '%s\n\n' "$image:$tag" "$digest" >> "$GITHUB_STEP_SUMMARY"
            printf '%s_digest=%s\n' "$component" "${digest##*@}" >> "$GITHUB_OUTPUT"
          done
          for component in api frontend auth; do
            image="ghcr.io/cog-forge/rolecue-$component"
            docker tag "rolecue-$component:ci" "$image:latest"
            docker push "$image:latest"
          done
      # Keyless signing: the signature binds the digest to this workflow's OIDC
      # identity (recorded in the Rekor transparency log). One signature per
      # digest covers every tag. The CycloneDX SBOM generated for the same image
      # in the `images` job is attached as a signed in-toto attestation.
      - name: Sign images and attest SBOM
        env:
          DIGEST_api: ${{ steps.push.outputs.api_digest }}
          DIGEST_auth: ${{ steps.push.outputs.auth_digest }}
          DIGEST_frontend: ${{ steps.push.outputs.frontend_digest }}
        run: |
          set -eu
          for component in api frontend auth; do
            digest=$(printenv "DIGEST_$component")
            test -n "$digest"
            ref="ghcr.io/cog-forge/rolecue-$component@$digest"
            cosign sign --yes "$ref"
            cosign attest --yes --type cyclonedx \
              --predicate "scans/scan-$component/sbom-$component.json" "$ref"
          done
      # The 14-day scan artifacts expire; keep the SBOMs longer for audits.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-release
          path: scans/scan-*/sbom-*.json
          retention-days: 90

  deploy:
    name: Deploy production
    needs: publish
    if: >-
      github.repository == 'cog-forge/rolecue' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, rolecue-production]
    timeout-minutes: 20
    concurrency:
      group: rolecue-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io/cog-forge
      IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Refuse to deploy anything not signed by this repository's CI workflow
      # on main. Verification is by digest, so a moved tag cannot slip through.
      - name: Verify image signatures
        env:
          DIGEST_api: ${{ needs.publish.outputs.api_digest }}
          DIGEST_auth: ${{ needs.publish.outputs.auth_digest }}
          DIGEST_frontend: ${{ needs.publish.outputs.frontend_digest }}
        run: |
          set -eu
          for component in api auth frontend; do
            digest=$(printenv "DIGEST_$component")
            test -n "$digest"
            cosign verify \
              --certificate-identity 'https://github.com/cog-forge/rolecue/.github/workflows/ci.yml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "ghcr.io/cog-forge/rolecue-$component@$digest" >/dev/null
          done
      - name: Pull promoted images and deploy
        env:
          API_IMAGE_DIGEST: ${{ needs.publish.outputs.api_digest }}
          AUTH_IMAGE_DIGEST: ${{ needs.publish.outputs.auth_digest }}
          FRONTEND_IMAGE_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
          # Production secrets are exposed to this step only (compose
          # interpolates the whole file, so every variable it requires lives
          # here). Checkout, registry login and signature verification run
          # without them.
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          APP_URL: ${{ secrets.APP_URL }}
          AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          LOGGER_LEVEL: ${{ vars.LOGGER_LEVEL }}
          LOGGER_FORMAT: ${{ vars.LOGGER_FORMAT }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_COOKIE_PREFIX: ${{ secrets.BETTER_AUTH_COOKIE_PREFIX }}
          BETTER_AUTH_COOKIE_DOMAIN: ${{ secrets.BETTER_AUTH_COOKIE_DOMAIN }}
          ADMIN_AUTH_INTERNAL_SECRET: ${{ secrets.ADMIN_AUTH_INTERNAL_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_VERIFY_EMAIL_TEMPLATE_ID: ${{ secrets.RESEND_VERIFY_EMAIL_TEMPLATE_ID }}
          RESEND_RESET_PASSWORD_TEMPLATE_ID: ${{ secrets.RESEND_RESET_PASSWORD_TEMPLATE_ID }}
          RESEND_ACCOUNT_LOCKED_TEMPLATE_ID: ${{ secrets.RESEND_ACCOUNT_LOCKED_TEMPLATE_ID }}
          RESEND_ACCOUNT_UNLOCKED_TEMPLATE_ID: ${{ secrets.RESEND_ACCOUNT_UNLOCKED_TEMPLATE_ID }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AVATAR_CONVERSION_ENABLED: ${{ vars.AVATAR_CONVERSION_ENABLED }}
          AVATAR_VRM_COMMERCIAL_USAGE: ${{ vars.AVATAR_VRM_COMMERCIAL_USAGE }}
          AVATAR_VRM_LICENSE_URL: ${{ vars.AVATAR_VRM_LICENSE_URL }}
        run: |
          set -eu
          docker compose -p rolecue -f .docker/compose.deploy.yaml pull
          docker compose -p rolecue -f .docker/compose.deploy.yaml up \
            --detach --remove-orphans api auth frontend caddy
